name: Check mineral abbreviations
on:
  pull_request:
permissions:
  contents: read
jobs:
  abbreviations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: python -m pip install mkdocs-material
      - name: Check automatic mineral abbreviations
        run: python -m unittest discover -s tests -p test_mineral_abbreviations.py -v
